# Published-image stack (GHCR). Used by ./start.sh by default and by
# ./release-smoke.sh (smoke requires immutable @sha256 refs via env).
services:
  gateway:
    image: ${SANDBOX_GATEWAY_IMAGE:-ghcr.io/cocofhu/sandbox-gateway:1.1.0}
    network_mode: host
    environment:
      SBGW_LISTEN: ":${GRASP_GATEWAY_PORT:-8899}"
      SBGW_DB_PATH: /data/gateway.db
      SBGW_DRIVER: docker
      SBGW_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox:1.1.0}
      # Require Bearer auth on /api/v1/* (healthz stays open).
      SBGW_API_KEYS: ${SBGW_API_KEYS:-grasp-local-demo}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.localdata/gateway:/data
    # Image is debian-slim + binary only (no wget/curl). Probe TCP listen.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${GRASP_GATEWAY_PORT:-8899}'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  grasp:
    image: ${GRASP_IMAGE:-ghcr.io/cocofhu/grasp:1.1.0}
    network_mode: host
    environment:
      GRASP_PORT: ${GRASP_PORT:-8080}
      GRASP_DB: /data/grasp.db
      GRASP_SANDBOX_GATEWAY_URL: http://127.0.0.1:${GRASP_GATEWAY_PORT:-8899}
      GRASP_SANDBOX_GATEWAY_API_KEY: ${SANDBOX_GATEWAY_API_KEY:-grasp-local-demo}
      GRASP_SANDBOX_IMAGE: ${GRASP_SANDBOX_IMAGE:-${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox:1.1.0}}
      # Generated by start.sh / release-smoke.sh when unset.
      GRASP_DOCTOR_TOKEN: ${GRASP_DOCTOR_TOKEN:-}
      GRASP_DEPLOYMENT_MODE: ${GRASP_DEPLOYMENT_MODE:-local-demo}
      GRASP_AUTH_USERS: ${GRASP_AUTH_USERS:-}
    volumes:
      - ./.localdata/db:/data
      # Agent profiles / org / platform-rules (WORKDIR-relative data/*). Keep separate from SQLite /data.
      - ./.localdata/app-data:/app/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/grasp",
          "doctor",
          "--api-url",
          "http://127.0.0.1:${GRASP_PORT:-8080}",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped
