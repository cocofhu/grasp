# Published-image stack (GHCR). Used by ./start.sh by default and by
# ./release-smoke.sh (smoke requires immutable @sha256 refs via env).
services:
  gateway:
    image: ${SANDBOX_GATEWAY_IMAGE:-ghcr.io/cocofhu/sandbox-gateway:3.3.0}
    network_mode: host
    environment:
      SBGW_LISTEN: ":${GRASP_GATEWAY_PORT:-8899}"
      SBGW_DB_PATH: /data/gateway.db
      SBGW_DRIVER: docker
      SBGW_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox:3.3.0}
      # Require Bearer auth on /api/v1/* (healthz stays open).
      SBGW_API_KEYS: ${SBGW_API_KEYS:-grasp-local-demo}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.localdata/gateway:/data
    # Image is debian-slim + binary only (no wget/curl). Probe TCP listen.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${GRASP_GATEWAY_PORT:-8899}'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  grasp:
    image: ${GRASP_IMAGE:-ghcr.io/cocofhu/grasp:3.3.0}
    network_mode: host
    environment:
      GRASP_PORT: ${GRASP_PORT:-8080}
      GRASP_DB: /data/grasp.db
      GRASP_DB_DRIVER: sqlite
      GRASP_BLOBS_ROOT: /app/data/blobs
      GRASP_SANDBOX_GATEWAY_URL: http://127.0.0.1:${GRASP_GATEWAY_PORT:-8899}
      GRASP_SANDBOX_GATEWAY_API_KEY: ${SANDBOX_GATEWAY_API_KEY:-grasp-local-demo}
      GRASP_SECRETS_KEY: ${GRASP_SECRETS_KEY:-}
      GRASP_SANDBOX_IMAGE: ${GRASP_SANDBOX_IMAGE:-${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox:3.3.0}}
      # Generated by start.sh / release-smoke.sh when unset.
      GRASP_DOCTOR_TOKEN: ${GRASP_DOCTOR_TOKEN:-}
      GRASP_DEPLOYMENT_MODE: ${GRASP_DEPLOYMENT_MODE:-local-demo}
      GRASP_AUTH_USERS: ${GRASP_AUTH_USERS:-}
      GRASP_STORAGE_DRIVER: ${GRASP_STORAGE_DRIVER:-}
      GRASP_S3_ENDPOINT: ${GRASP_S3_ENDPOINT:-}
      GRASP_S3_REGION: ${GRASP_S3_REGION:-}
      GRASP_S3_BUCKET: ${GRASP_S3_BUCKET:-}
      GRASP_S3_PREFIX: ${GRASP_S3_PREFIX:-}
      GRASP_S3_ACCESS_KEY_ID: ${GRASP_S3_ACCESS_KEY_ID:-}
      GRASP_S3_SECRET_ACCESS_KEY: ${GRASP_S3_SECRET_ACCESS_KEY:-}
      GRASP_S3_SESSION_TOKEN: ${GRASP_S3_SESSION_TOKEN:-}
      GRASP_S3_PATH_STYLE: ${GRASP_S3_PATH_STYLE:-}
      # Independent continuity marker; never falls back to payload credentials.
      GRASP_EXECUTION_CONTROL_DRIVER: ${GRASP_EXECUTION_CONTROL_DRIVER:-local}
      GRASP_EXECUTION_CONTROL_BLOBS_ROOT: ${GRASP_EXECUTION_CONTROL_BLOBS_ROOT:-/execution-control}
      GRASP_EXECUTION_CONTROL_S3_ENDPOINT: ${GRASP_EXECUTION_CONTROL_S3_ENDPOINT:-}
      GRASP_EXECUTION_CONTROL_S3_REGION: ${GRASP_EXECUTION_CONTROL_S3_REGION:-}
      GRASP_EXECUTION_CONTROL_S3_BUCKET: ${GRASP_EXECUTION_CONTROL_S3_BUCKET:-}
      GRASP_EXECUTION_CONTROL_S3_PREFIX: ${GRASP_EXECUTION_CONTROL_S3_PREFIX:-}
      GRASP_EXECUTION_CONTROL_S3_ACCESS_KEY_ID: ${GRASP_EXECUTION_CONTROL_S3_ACCESS_KEY_ID:-}
      GRASP_EXECUTION_CONTROL_S3_SECRET_ACCESS_KEY: ${GRASP_EXECUTION_CONTROL_S3_SECRET_ACCESS_KEY:-}
      GRASP_EXECUTION_CONTROL_S3_SESSION_TOKEN: ${GRASP_EXECUTION_CONTROL_S3_SESSION_TOKEN:-}
      GRASP_EXECUTION_CONTROL_S3_PATH_STYLE: ${GRASP_EXECUTION_CONTROL_S3_PATH_STYLE:-}
    volumes:
      - ./.localdata/db:/data
      # Agent profiles / org (WORKDIR-relative data/*). Keep separate from SQLite /data.
      - ./.localdata/app-data:/app/data
      - ./.localdata/execution-control:/execution-control
      - ./.localdata/execution-maintenance:/execution-maintenance
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/grasp",
          "doctor",
          "--api-url",
          "http://127.0.0.1:${GRASP_PORT:-8080}",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # Prepared and started by start.sh when driver=s3 and endpoint is empty.
  objectstore:
    image: ${GRASP_LOCAL_OBJECTSTORE_IMAGE:-chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0}
    profiles: [local-storage]
    user: "${GRASP_LOCAL_OBJECTSTORE_UID:-10001}:${GRASP_LOCAL_OBJECTSTORE_GID:-10001}"
    entrypoint: [/usr/bin/weed]
    environment:
      GODEBUG: fips140=on
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -bucket=${GRASP_S3_BUCKET:-grasp}
      - -s3.config=/etc/grasp-storage/iam.json
      - -s3.autoCreateBucket=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
    ports:
      - "127.0.0.1:${GRASP_LOCAL_OBJECTSTORE_PORT:-8333}:8333"
    volumes:
      - ${GRASP_LOCAL_OBJECTSTORE_DIR:-./.localdata/objectstore}/data:/data
      - ${GRASP_LOCAL_OBJECTSTORE_DIR:-./.localdata/objectstore}/iam.json:/etc/grasp-storage/iam.json:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8888/buckets/${GRASP_S3_BUCKET:-grasp}/?limit=1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
