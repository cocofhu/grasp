<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <script data-boot-theme>
      ;(function () {
        var root = document.documentElement
        var previewTheme = null
        function valid(value) { return value === 'light' || value === 'dark' }
        if (location.pathname.indexOf('/embed/') === 0) {
          try { previewTheme = new URLSearchParams(location.hash.slice(1)).get('theme') } catch (_) {}
          var key = 'grasp-embed-theme:' + location.pathname
          if (!valid(previewTheme)) {
            try { previewTheme = sessionStorage.getItem(key) } catch (_) {}
          }
          if (valid(previewTheme)) {
            root.setAttribute('data-grasp-embed-theme', previewTheme)
            try { sessionStorage.setItem(key, previewTheme) } catch (_) {}
          }
        }
        var chosen = previewTheme
        if (!valid(chosen)) {
          try { chosen = localStorage.getItem('grasp-theme') } catch (_) {}
        }
        if (!valid(chosen)) chosen = 'dark'
        root.classList.toggle('light', chosen === 'light')
        root.classList.toggle('dark', chosen === 'dark')
        root.style.colorScheme = chosen
        document.querySelector('meta[name="color-scheme"]').content = chosen
      })()
    </script>
    <title>Grasp · 开发工作流编排</title>
    <link rel="icon" type="image/x-icon" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" href="/favicon.ico?v=grasp-character" />
    <!-- Brand-critical Inter 600: discover font before CSS/JS (same URL as @font-face) -->
    <link
      rel="preload"
      href="/fonts/inter-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Critical boot shell: paint brand before Vue mount (replaced on #app mount) */
      :root { --boot-bg: #0a0a0b; --boot-txt: #ededf0; --boot-muted: #6e6e78; }
      html.light { --boot-bg: #fafafb; --boot-txt: #18181b; --boot-muted: #52525b; }
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-txt);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, rgba(123, 97, 255, 0.08), transparent),
          var(--boot-bg);
      }
      .boot-shell .brand-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1px;
        line-height: 1.2;
      }
      .boot-shell .brand-logo__name {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #a5b4fc;
        background: linear-gradient(90deg, #7b61ff 0%, #818cf8 35%, #6366f1 55%, #7b61ff 75%, #a78bfa 100%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .boot-shell .brand-logo__tagline {
        font-size: 12px;
        color: var(--boot-muted);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" data-boot-shell aria-busy="true">
        <div class="brand-logo brand-logo--lg">
          <span class="brand-logo__name">Grasp</span>
          <span class="brand-logo__tagline" id="boot-tagline">开发工作流编排</span>
        </div>
      </div>
    </div>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('grasp-locale')
          var lang = (saved || navigator.language || 'zh-CN').toLowerCase()
          var en = lang === 'en' || (lang.startsWith('en') && !lang.startsWith('zh'))
          if (en) {
            document.documentElement.lang = 'en'
            var el = document.getElementById('boot-tagline')
            if (el) el.textContent = 'Dev workflow orchestration'
          }
        } catch (_) {}
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
