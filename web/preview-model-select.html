<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择模型</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      .preview-stage {
        min-height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 28px 20px 36px;
        background: rgb(var(--c-base));
      }
      .preview-composer {
        width: min(720px, 100%);
        border: 1px solid rgb(var(--c-line-strong) / 0.7);
        border-radius: 20px;
        background: rgb(var(--c-surface));
        box-shadow: 0 2px 10px rgb(var(--c-txt) / 0.025);
        padding: 10px;
      }
      .preview-composer textarea {
        display: block;
        width: 100%;
        min-height: 48px;
        resize: none;
        border: 0;
        background: transparent;
        color: rgb(var(--c-txt));
        font: inherit;
        font-size: 14px;
        line-height: 1.75;
        padding: 8px 4px;
        outline: none;
      }
      .preview-toolbar { display: flex; align-items: center; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/preview-model-select.ts"></script>
  </body>
</html>
