GRASP_SOLO_BACKUP_KEEP: "每个沙箱保留的成功恢复点数量，文件备份和 E2B 快照共用。新保存成功后清理旧版本"
GRASP_SOLO_BACKUP_S3_ENDPOINT: "S3 兼容服务地址。留空使用 region 对应的 AWS 地址"
GRASP_SOLO_BACKUP_S3_REGION: "S3 区域"
GRASP_SOLO_BACKUP_S3_BUCKET: "设置后沙箱工作区备份写入该 S3 桶，否则写本地目录"
GRASP_SOLO_BACKUP_S3_PREFIX: "S3 对象键前缀"
GRASP_SOLO_BACKUP_S3_ACCESS_KEY_ID: "S3 访问密钥 ID"
GRASP_SOLO_BACKUP_S3_SECRET_ACCESS_KEY: "S3 访问密钥"
GRASP_SOLO_BACKUP_S3_PATH_STYLE: "使用路径式桶地址（MinIO 等自托管服务通常需要）"
GRASP_GITHUB_OAUTH_CLIENT_ID: "GitHub OAuth App 的 Client ID（需勾选 Enable Device Flow）。设置后工作区可用「用 GitHub 登录」添加 github.com 凭据，不需要 client secret"
GRASP_CODEX_LOGIN_REFRESH_LEAD: "Codex ChatGPT 登录在 access token 到期前多久由平台续期"
GRASP_CODEX_LOGIN_CHECK_INTERVAL: "平台检查 Codex 登录是否需要续期的间隔"
GRASP_SSH_GATEWAY_ENABLED: "开启内置 SSH 网关，让本地 VS Code / Cursor 等 IDE 通过 Remote-SSH 连接沙箱（用户名 sbx-<沙箱 ID>，在设置页登记公钥）"
GRASP_SSH_GATEWAY_LISTEN: "SSH 网关监听地址。需要在部署中对外开放这个 TCP 端口"
GRASP_SSH_GATEWAY_PUBLIC_HOST: "用户 ~/.ssh/config 里填写的网关主机名。留空使用浏览器访问 Grasp 的主机名"
GRASP_SSH_GATEWAY_PUBLIC_PORT: "用户连接的网关端口（端口映射或负载均衡改了端口时设置）"
GRASP_SSH_GATEWAY_HOST_KEY_PATH: "网关主机私钥路径，首次启动自动生成。必须放在持久卷上并由所有副本共享，否则客户端会提示主机密钥变更"
GRASP_SSH_GATEWAY_MAX_CONNS: "网关同时连接数上限"
GRASP_SSH_GATEWAY_MAX_CONNS_PER_SANDBOX: "单个沙箱同时连接数上限"
GRASP_SSH_GATEWAY_ADMINS_ONLY: "仅允许管理员账号通过 SSH 网关连接。关闭时 Solo 会话的所有者可以进入自己的沙箱，工作流等其他沙箱只对管理员开放"
GRASP_CODEX_LOGIN_AUTH_BASE_URL: "OpenAI 登录服务地址，用于 Codex 登录续期和设备码登录。请求遵循 HTTPS_PROXY"
