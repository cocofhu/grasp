GRASP_PORT: "HTTP 监听端口"
GRASP_DEPLOYMENT_MODE: "部署信任边界。local-demo 仅限 loopback"
GRASP_MCP_ADVERTISE: "沙箱回连 grasp-tool MCP 的 API 基址"
