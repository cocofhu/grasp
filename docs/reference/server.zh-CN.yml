GRASP_PREVIEW_EXPOSE_STRATEGY: "全局默认预览暴露策略，auto、subdomain 或 none（direct 仅限直连网关在 YAML 连接级配置）"
GRASP_PREVIEW_EXPOSE_SUBDOMAIN_BASE_URL: "通配子域名预览基址（HTTP(S) DNS origin，拒绝 IP。production 要求 https 且与平台不同根域）"
GRASP_DB: "SQLite 数据库文件"
GRASP_DB_DRIVER: "数据库驱动，sqlite 或 mysql"
GRASP_DB_DSN: "MySQL DSN"
GRASP_PROFILES_ROOT: "Agent profile 根目录"
GRASP_NODE_AUTO_RETRY: "节点自动重试上限"
GRASP_SANDBOX_IMAGE: "已废弃并忽略（含 sandbox.images.* 与 GRASP_SANDBOX_IMAGE_*），沙箱镜像由 sandbox-gateway 配置（docker/kubernetes 的 image 或 profiles，E2B 的 defaultTemplate 或 templates），Grasp 通过 GET /api/v1/capabilities 读取"
GRASP_SANDBOX_GATEWAY_URL: "sandbox-gateway 控制面地址"
GRASP_SANDBOX_GATEWAY_API_KEY: "gateway Bearer token"
GRASP_SANDBOX_GATEWAY_TRANSPORT: "沙箱连接方式，direct 直连或 gateway 认证通道。gateway 要求 API key，预览按 preview.expose / 连接级 preview_expose 策略暴露"
GRASP_SANDBOX_DEFAULT_GATEWAY: "新沙箱使用的命名网关。已有沙箱保持原绑定"
GRASP_SANDBOX_PRIVATE_ENDPOINTS: "显式标记沙箱端点仅服务端可达。仅影响 preview.expose auto 展开与传统私有启动等待，不再因 gateway 通道自动覆盖"
GRASP_OPENCODE_CATALOG_URL: "OpenCode 模型目录地址。出网受限时改指镜像"
GRASP_SANDBOX_ENV: "注入所有沙箱的通用环境变量"
GRASP_AGENT_TIMEOUT_SEC: "已废弃并忽略，Agent 回合不再有单轮总时限。节点总时限在画布节点上配置"
GRASP_CHAT_IDLE_SEC: "Agent 无动作时限秒数，既无输出也无 CPU/IO 活动这么久，先续跑一次，仍无活动则中断本轮。设置后设置页只读"
GRASP_AGENT_NODE_HARD_CAP_HOURS: "未在画布配置总时限的 Agent 节点的兜底上限（小时）"
GRASP_SANDBOX_MAX_ATTEMPTS: "可重试沙箱故障的最大尝试次数"
GRASP_SANDBOX_RETRY_BACKOFF_SEC: "沙箱重试基础退避秒数"
GRASP_SANDBOX_CREATE_TIMEOUT_SEC: "等待沙箱就绪的超时秒数"
GRASP_SANDBOX_MEMORY_TRIM_IDLE_MIN: "E2B 沙箱模型回合结束多少分钟后首次清理页面缓存并整理内存，把内存还给主机。负数关闭"
GRASP_SANDBOX_MEMORY_TRIM_INTERVAL_MIN: "E2B 沙箱持续空闲时再次清理的间隔分钟数"
GRASP_SANDBOX_MEMORY_TRIM_MIN_CACHE_MB: "沙箱页面缓存低于该值（MiB）时跳过清理"
GRASP_SANDBOX_MEMORY_MB: "沙箱内存覆盖（MiB）。0 跟随网关/模板，非零至少 1024，E2B 必须匹配模板。环境变量覆盖并锁定设置页"
GRASP_SANDBOX_WORK_DIR: "ConfigHome 宿主工作目录"
GRASP_SANDBOX_RUNTIME_BUNDLE: "下发给沙箱的运行时包（scripts/build-sandbox-runtime.sh 构建）"
GRASP_AUTH_SESSION_TTL: "会话有效期"
GRASP_AUTH_USERS: "静态账号数组。非本地部署必须显式配置"
GRASP_SECRETS_KEY: "凭据加密主密钥（base64 32 字节）。视作固定盐、请勿轮换。未设置时非 production 模式在 SQLite 库旁自动生成 secrets.key"
GRASP_STORAGE_DRIVER: "附件存储驱动，local（预留 cos）"
GRASP_MAX_FILE_BYTES: "Agent 单文件导入大小上限（字节）"
GRASP_BLOBS_ROOT: "本地附件 blob 根目录"
