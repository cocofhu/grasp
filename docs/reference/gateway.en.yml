common:
  driver: "Selects `docker`, `kubernetes`, or `e2b`. The environment and file must select the same backend."
  server.listen: "Address where the gateway API listens."
  server.finalizeTimeoutSeconds: "How long a create or reinstall can wait for readiness."
  database.driver: "Choose `sqlite` or `mysql`."
  database.path: "Persistent SQLite file."
  database.dsn: "MySQL DSN. Takes precedence over individual connection fields."
  database.host / database.port: "MySQL host and port."
  database.user / database.password / database.name: "MySQL credentials and database name."
  database.params: "MySQL parameters. Defaults add `charset=utf8mb4&parseTime=True&loc=Local`."
  auth.apiKeys: "Bearer API keys. Separate environment values with commas. An empty list disables v1 authentication and prevents v2 transport."
  orphanGC.enabled: "Remove workloads from this deployment that have no database record."
  orphanGC.intervalSeconds: "Interval between orphan scans."
  orphanGC.minAgeSeconds: "Minimum age before cleanup. Use `0` to remove the age limit."
  ports.session / ports.codeServer / ports.ssh: "Session, IDE, and SSH ports."
  ports.cdp / ports.novnc: "Internal ports. Docker hosts and Kubernetes load balancers keep them private."
  ports.app: "Additional application ports."
  SBGW_LOG_LEVEL: "Gateway logging level."
  SBGW_LOG_PRETTY: "Enable human-readable gateway logging."
docker:
  image: "OCI image for new Docker sandboxes."
  bindIP: "Host address where Docker publishes ports."
  network: "Docker network to attach to."
  namePrefix / shmSize: "Container name prefix and shared memory size."
  resources.default: "Used when the request omits resources. `0` means unlimited. Fields are `cpuCores`, `memoryMB`, and `diskGi`."
  resources.max: "Request limits. The Docker disk value does not create a storage quota."
  profiles: "Optional map of environment names to OCI images for named Grasp connections."
kubernetes:
  image: "OCI image that cluster nodes can pull."
  inCluster: "Use the pod service account."
  kubeconfig: "Blank uses standard kubeconfig or in-cluster discovery."
  namespace: "Namespace for sandbox resources."
  namePrefix: "Prefix used to name workloads."
  storageClass: "Blank uses the cluster default storage class."
  pvcAnnotations: "Annotations on newly created PVCs."
  imagePullSecret: "Name of a private registry secret."
  imagePullPolicy: "Choose `Always`, `IfNotPresent`, or `Never`."
  enableLoadBalancer: "Create a load balancer Service for exposed ports."
  resources.default / resources.max: "Default and maximum CPU, memory, and PVC size. Fields are `cpuCores`, `memoryMB`, and `diskGi`."
  cpuRequestCores / memoryRequestMB: "Fixed scheduling requests take precedence. Set a field to `0` to use its ratio."
  cpuRequestRatio / memoryRequestRatio: "Scheduling request equals limit multiplied by this ratio, in `(0, 1]`. The driver enforces minimum requests."
  profiles: "Optional map of environment names to OCI images."
e2b:
  apiURL: "Provider control API origin. Use your self-hosted address or `https://api.e2b.app` for the cloud service."
  sandboxURL: "Self-hosted sandbox proxy origin. Blank uses the hostname returned for each sandbox. A missing returned hostname causes an error."
  apiKey: "Provider API key. Prefer passing it through the environment."
  ownerID: "Stable, unique deployment identifier for scoping resources."
  stateDir: "Persistent private state used to recover gateway connections."
  bootTimeoutSeconds: "Deadline for booting a guest and establishing private readiness."
  leaseSeconds: "Requested provider lease in seconds. Minimum `30`."
  renewIntervalSeconds: "Lease renewal interval. Must be positive and less than half the lease."
  autoPause: "Pause a new guest at lease expiry. An explicit delete still destroys it."
  templates: "Map a name to `templateID`, `cpuCores`, `memoryMB`, and `diskGi`."
  defaultTemplate: "Choose an existing name from `templates`."
runtime:
  GRASP_RUNTIME_URL: "Grasp provides the runtime bundle download URL."
  SANDBOX_INJECT / SANDBOX_INJECT_HEADERS: "Grasp supplies the configuration bundle and scoped download authorization."
  WORKSPACE_DIR: "Code directory inside the sandbox. Grasp's `sandbox.work_dir` configures host-side staging."
  ROOT_PASSWORD: "Grasp supplies the password for managed sandboxes. The standalone default applies when running the image by itself."
  SSH_KEY: "Optional SSH public key."
  CODE_SERVER_PORT: "Browser IDE listen port."
  AGENT_PROVIDER: "Grasp sets the coding tool for the agent. Gateway `driver` selects the sandbox backend."
  ACP_BRIDGE_PORT: "Agent session service port."
  ACP_BRIDGE_PASSWORD: "Grasp supplies the session authentication password at creation."
  SKIP_INNER_DOCKER: "Set to `1` to skip starting the inner Docker daemon."
  INNER_DOCKER_STORAGE_DRIVER: "Storage driver used by the inner Docker daemon."
  PREVIEW_DIRECT / PREVIEW_PORT: "Direct preview configuration and app port injected according to the preview policy."
