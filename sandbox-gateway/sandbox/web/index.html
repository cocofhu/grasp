<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- 可选：覆盖 WebSocket 地址（默认同页相对路径解析为 …/ws）；可写完整 wss:// 或相对路径 -->
    <meta name="acp-bridge-ws" content=""/>
    <title>AgentChat</title>
    <script>
        (function () {
            /* 与 static/js/app/embed.js parseThemeHash 一致：内嵌时宿主经 #theme= 指定首屏主题 */
            const h = new URLSearchParams(location.hash.replace(/^#/, '')).get('theme');
            if (h === 'light' || h === 'dark') {
                document.documentElement.setAttribute('data-theme', h);
                return;
            }
            try {
                const s = localStorage.getItem('acp-bridge-theme');
                if (s === 'light' || s === 'dark') {
                    document.documentElement.setAttribute('data-theme', s);
                    return;
                }
            } catch (e) {
            }
            const q = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
            document.documentElement.setAttribute('data-theme', q && q.matches ? 'light' : 'dark');
        })();
    </script>
    <link rel="stylesheet" href="assets/css/app.css"/>
</head>
<body>
<div class="cc-app">
    <header class="cc-header">
        <div class="cc-header-left">
            <span class="cc-brand">AgentChat</span>
            <div class="cc-header-status-wrap" id="statusWrap">
                <span class="cc-conn-dot" aria-hidden="true"></span>
                <span class="cc-header-status" id="status" aria-live="polite">正在加载…</span>
            </div>
            <button type="button" class="cc-model-btn" id="btnModelPicker" title="选择模型" disabled>
                <span class="cc-model-btn-label" id="modelLabel">Auto</span>
                <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            </button>
            <button type="button" class="cc-restart-agent-btn" id="btnRestartAgent"
                    title="结束当前 Agent 子进程并重新握手（新 sessionId）" disabled>
                重启
            </button>
        </div>
        <div class="cc-header-right">
            <button type="button" class="cc-qq-btn" id="btnQQConfig" title="配置 QQ 机器人" aria-label="配置 QQ 机器人">
                <svg class="cc-qq-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" fill-rule="nonzero" d="M17.535 12.514l-.696-1.796c0-.021.01-.375.01-.558C16.848 7.088 15.446 4 12 4c-3.446 0-4.848 3.088-4.848 6.16 0 .183.009.537.01.558l-.696 1.796c-.19.515-.38 1.05-.517 1.51-.657 2.189-.444 3.095-.282 3.115.348.043 1.354-1.648 1.354-1.648 0 .98.488 2.258 1.542 3.18-.394.127-.878.32-1.188.557-.28.214-.245.431-.194.52.22.385 3.79.245 4.82.125 1.03.12 4.599.26 4.82-.126.05-.088.085-.305-.194-.519-.311-.237-.795-.43-1.19-.556 1.055-.923 1.542-2.202 1.542-3.181 0 0 1.007 1.691 1.355 1.648.162-.02.378-.928-.283-3.116-.14-.463-.325-.994-.516-1.509z"/>
                </svg>
            </button>
            <button type="button" class="cc-stop-btn" id="btnCancel" title="停止当前轮次" aria-label="停止当前轮次">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                </svg>
            </button>
            <button type="button" class="cc-toggle-detail-btn" id="btnToggleDetail" title="显示/隐藏工具调用与思考过程">
                <svg class="cc-toggle-detail-icon-show" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor"
                     stroke-width="2" fill="none" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="cc-toggle-detail-icon-hide" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor"
                     stroke-width="2" fill="none" aria-hidden="true">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
            <button type="button" class="cc-icon-btn" id="btnTheme" title="切换浅色 / 深色（会记住）"
                    aria-label="切换主题">
                <svg class="cc-theme-moon" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor"
                     stroke-width="2" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none"/>
                </svg>
                <svg class="cc-theme-sun" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor"
                     stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="5" fill="none"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                          fill="none"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- 会话 Tab：每个 Tab 是同一 provider 下独立的 Agent 会话 -->
    <nav class="cc-tabbar" aria-label="会话">
        <div class="cc-tabs" id="tabList" role="tablist"></div>
        <button type="button" class="cc-tab-new" id="btnNewTab" title="新建会话" aria-label="新建会话">
            <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path d="M12 5v14M5 12h14" fill="none"/>
            </svg>
        </button>
    </nav>

    <div class="cc-main-col">
        <div class="cc-panes" id="chatPanes"></div>

        <footer class="cc-input-panel">
            <div class="cc-input-inner">
                <!-- 附件预览区 -->
                <div class="cc-attach-preview" id="attachPreview" hidden></div>
                <div class="cc-input-box">
                    <button type="button" class="cc-attach-btn" id="btnAttach" title="添加图片 / 文件">
                        <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                             aria-hidden="true">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                                  fill="none"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" multiple
                           accept="image/*,.pdf,.txt,.md,.json,.csv,.xml,.yaml,.yml,.log,.go,.js,.ts,.py,.java,.c,.cpp,.h,.rs,.rb,.sh,.sql,.html,.css"
                           hidden/>
                    <label for="input" class="cc-sr-only">发送消息</label>
                    <textarea
                            id="input"
                            class="cc-textarea"
                            rows="1"
                            placeholder="输入消息，Enter 发送，Ctrl/⌘+Enter 换行"
                            autocomplete="off"
                    ></textarea>
                    <button type="button" class="cc-send" id="btnSend" aria-label="发送">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>
</div>

<div class="cc-qq-modal-backdrop" id="qqDrawerBackdrop" hidden></div>
<div class="cc-qq-modal" id="qqDrawer" role="dialog" aria-modal="true" aria-labelledby="qqConfigTitle" hidden>
    <div class="cc-qq-modal-panel">
    <div class="cc-qq-modal-head">
        <div class="cc-qq-modal-title" id="qqConfigTitle">配置 QQ 机器人</div>
        <button type="button" class="cc-drawer-close" id="qqDrawerClose" aria-label="关闭">×</button>
    </div>
    <form class="cc-qq-modal-body" id="qqConfigForm">
        <p class="cc-drawer-hint">
            使用 QQ 官方机器人 WebSocket 网关模式连接，无需公网地址。
            在 <a href="https://q.qq.com/qqbot/openclaw/" target="_blank">QQ 开放平台</a> 获取 AppID 和 AppSecret。
            <strong style="color:var(--danger,#e53935)">QQ机器人仅限本人使用，请勿将机器人分享到外部。</strong>
        </p>
        <label class="cc-field cc-field-row">
            <input type="checkbox" id="qqEnabled"/>
            <span>启用 QQ 机器人</span>
            <span class="cc-qq-status" id="qqConnectionStatus">未检测</span>
        </label>
        <label class="cc-field">
            <span class="cc-field-label">App ID</span>
            <input class="cc-field-input" id="qqAppId" autocomplete="off" placeholder="QQ 机器人 AppID"/>
        </label>
        <label class="cc-field">
            <span class="cc-field-label">App Secret</span>
            <input class="cc-field-input" id="qqAppSecret" type="password" autocomplete="new-password"
                   placeholder="留空表示保留已有密钥"/>
        </label>
        <label class="cc-field">
            <span class="cc-field-label">允许的 OpenID（可选，每行一个）</span>
            <textarea class="cc-field-input" id="qqAllowOpenIds" placeholder="留空表示不限制私聊用户"></textarea>
        </label>
        <label class="cc-field">
            <span class="cc-field-label">允许的群 OpenID（可选，每行一个）</span>
            <textarea class="cc-field-input" id="qqAllowGroupOpenIds" placeholder="留空表示不限制群聊"></textarea>
        </label>
        <div class="cc-qq-config-status" id="qqConfigStatus" role="status" aria-live="polite"></div>
        <button type="submit" class="cc-btn cc-btn-primary cc-btn-block">保存配置</button>
    </form>
    </div>
</div>

<div id="perm" class="cc-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="permTitle">
    <div class="cc-modal">
        <h2 class="cc-modal-title" id="permTitle">权限请求</h2>
        <pre class="cc-modal-pre" id="permText"></pre>
        <div class="cc-modal-actions" id="permOpts"></div>
    </div>
</div>

<!-- 图片预览 Lightbox -->
<div id="imgLightbox" class="cc-lightbox" hidden>
    <div class="cc-lightbox-backdrop"></div>
    <img class="cc-lightbox-img" id="lightboxImg" alt="预览"
         src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="/>
    <button type="button" class="cc-lightbox-close" id="lightboxClose" aria-label="关闭预览">✕</button>
</div>

<!-- Mermaid 图表放大 -->
<div id="mermaidLightbox" class="cc-mermaid-lightbox" hidden>
    <div class="cc-mermaid-lightbox-backdrop"></div>
    <div class="cc-mermaid-lightbox-panel" role="dialog" aria-modal="true" aria-label="图表放大预览">
        <button type="button" class="cc-mermaid-lightbox-close" id="mermaidLightboxClose" aria-label="关闭">✕</button>
        <div class="cc-mermaid-lightbox-scroll">
            <div class="cc-mermaid-lightbox-inner" id="mermaidLightboxInner"></div>
        </div>
    </div>
</div>

<div class="cc-model-modal-backdrop" id="modelModalBackdrop" hidden></div>
<div class="cc-model-modal" id="modelModal" role="dialog" aria-modal="true" aria-label="选择模型" hidden>
    <div class="cc-model-modal-panel">
        <div class="cc-model-modal-head">
            <input type="text" class="cc-model-search" id="modelSearch" placeholder="搜索模型…" autocomplete="off"/>
            <button type="button" class="cc-model-modal-close" id="modelModalClose" aria-label="关闭">✕</button>
        </div>
        <div class="cc-model-list" id="modelList"></div>
    </div>
</div>

<template id="chatPaneTpl">
    <main class="cc-scroll cc-chat-pane" role="tabpanel">
        <div class="cc-list cc-log">
            <div class="cc-empty">
                <div class="cc-empty-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="8" width="16" height="12" rx="3"/>
                        <path d="M12 4v4M9 13v1M15 13v1M9.5 17h5"/>
                    </svg>
                </div>
                <h2 class="cc-empty-title">开始和 Agent 对话</h2>
                <p class="cc-empty-desc">在下方输入需求，Agent 会在沙箱里读代码、改代码并回报进度。</p>
            </div>
        </div>
        <!-- 待发送队列在会话流底部 -->
        <details class="cc-queue-panel" hidden>
            <summary class="cc-queue-summary">
                <span class="cc-queue-spin" aria-hidden="true"></span>
                <span class="cc-queue-summary-text">排队</span>
            </summary>
            <div class="cc-queue-body" aria-label="待发送消息队列"></div>
        </details>
    </main>
</template>

<script type="module" src="assets/js/app/main.js"></script>
</body>
</html>
