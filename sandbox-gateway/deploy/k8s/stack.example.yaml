# Copy outside the repository and customize before applying. Secrets are
# created separately as described in README.md. Image tags are examples;
# pin reviewed release digests for production. Grasp and gateway must include
# the backend configuration split documented in ../../../CONFIGURATION.md;
# replace the control-plane image tags below with builds containing that change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-gateway-config
  namespace: grasp-system
data:
  config.yaml: |
    server:
      listen: ":8080"
    driver: kubernetes
    database:
      driver: sqlite
      path: /data/gateway.db
    kubernetes:
      image: ghcr.io/cocofhu/universal-sandbox:4.0.4
      inCluster: true
      namespace: grasp-sandboxes
      namePrefix: sbx-
      storageClass: replace-with-your-storage-class
      imagePullSecret: ""  # optional Secret in grasp-sandboxes
      imagePullPolicy: IfNotPresent
      enableLoadBalancer: false
      resources:
        default: {cpuCores: 2, memoryMB: 4096, diskGi: 25}
        max: {cpuCores: 8, memoryMB: 16384, diskGi: 500}
      cpuRequestCores: 0.25
      memoryRequestMB: 512
    orphanGC:
      enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-gateway-data
  namespace: grasp-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: replace-with-your-storage-class
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-gateway
  namespace: grasp-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sandbox-gateway
  template:
    metadata:
      labels:
        app: sandbox-gateway
    spec:
      serviceAccountName: sandbox-gateway
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      containers:
        - name: gateway
          image: ghcr.io/cocofhu/sandbox-gateway:4.0.4
          env:
            - name: SBGW_CONFIG
              value: /etc/sandbox-gateway/config.yaml
            - name: SBGW_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: grasp-secrets
                  key: gateway-api-key
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/sandbox-gateway
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: sandbox-gateway-config
        - name: data
          persistentVolumeClaim:
            claimName: sandbox-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway
  namespace: grasp-system
spec:
  selector:
    app: sandbox-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grasp-config
  namespace: grasp-system
data:
  config.yaml: |
    server:
      port: 8080
      deployment_mode: production
      public_advertise: https://grasp.example.com
      mcp_advertise: http://grasp.grasp-system.svc.cluster.local:8080
    database:
      path: /data/grasp.db
    sandbox:
      gateway_url: http://sandbox-gateway.grasp-system.svc.cluster.local:8080
      gateway_transport: gateway
      sandbox_memory_mb: 0  # use the gateway's resource defaults
    # Local IDEs (VS Code / Cursor Remote-SSH) open sandboxes over SSH. An
    # Ingress only carries HTTP: enabling this also needs the grasp-ssh
    # Service at the end of this file.
    ssh_gateway:
      enabled: false
      listen: ":2222"
      public_host: ssh.grasp.example.com
      host_key_path: /data/ssh-gateway/host_ed25519_key  # on the PVC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grasp-data
  namespace: grasp-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: replace-with-your-storage-class
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grasp
  namespace: grasp-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grasp
  template:
    metadata:
      labels:
        app: grasp
    spec:
      serviceAccountName: grasp
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      containers:
        - name: grasp
          image: ghcr.io/cocofhu/grasp:4.0.4
          env:
            - name: CONFIG_PATH
              value: /etc/grasp/config.yaml
            - name: GRASP_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: grasp-secrets
                  key: auth-users
            - name: GRASP_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: grasp-secrets
                  key: secrets-key
            - name: GRASP_SANDBOX_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grasp-secrets
                  key: gateway-api-key
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 2222
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/grasp
              readOnly: true
            - name: data
              mountPath: /data
              subPath: db
            - name: data
              mountPath: /app/data
              subPath: app-data
      volumes:
        - name: config
          configMap:
            name: grasp-config
        - name: data
          persistentVolumeClaim:
            claimName: grasp-data
---
apiVersion: v1
kind: Service
metadata:
  name: grasp
  namespace: grasp-system
spec:
  selector:
    app: grasp
  ports:
    - name: http
      port: 8080
      targetPort: http
