# Incremental RBAC for kubernetes.volumeArchive: the gateway runs a helper pod
# per archive/restore and streams tar through pods/exec.
# Apply alongside existing Roles; do NOT kubectl replace a full production Role
# with this file — that would drop Deployment/PVC/etc. permissions.
#
# Namespace MUST match the sandbox workload namespace (SBGW_K8S_NAMESPACE /
# kubernetes.namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-gateway-volume-archive
  namespace: sandbox-gateway
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-gateway-volume-archive
  namespace: sandbox-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-gateway-volume-archive
subjects:
  - kind: ServiceAccount
    name: sandbox-gateway
    namespace: sandbox-gateway
