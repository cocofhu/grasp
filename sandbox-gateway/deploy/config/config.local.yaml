# Docker-only local Compose config. Grasp follows its image/resource defaults.
driver: docker
server:
  listen: ":8080"
database:
  driver: sqlite
  path: gateway.db
docker:
  image: universal-sandbox:local # override with SBGW_DOCKER_IMAGE
  bindIP: "127.0.0.1"
  resources:
    default: {cpuCores: 2, memoryMB: 4096, diskGi: 25}
    max: {cpuCores: 8, memoryMB: 16384, diskGi: 500}
auth:
  apiKeys: [] # local demo only; set SBGW_API_KEYS for gateway transport
