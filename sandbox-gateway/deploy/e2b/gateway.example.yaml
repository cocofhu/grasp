# Self-hosted E2B gateway. Copy outside the checkout; set E2B_GATEWAY_CONFIG.
# Required provider values below are examples, not built-in defaults.
driver: e2b
server:
  listen: "127.0.0.1:8899"
  finalizeTimeoutSeconds: 1200
database:
  driver: sqlite
  path: /data/gateway.db
ports:
  session: 8765
  codeServer: 8744
  ssh: 22
  cdp: 9222
  novnc: 6080
  app: [18080] # all E2B endpoints bind only to host loopback

e2b:
  apiURL: https://api.e2b.example.com # your E2B control API; no implicit cloud URL
  sandboxURL: https://sandbox.e2b.example.com # your private sandbox proxy origin
  # apiKey: injected using E2B_API_KEY in Compose / SBGW_E2B_API_KEY in the process
  ownerID: replace-with-stable-unique-deployment-id
  stateDir: /data/e2b # persistent; keep with the gateway DB
  bootTimeoutSeconds: 600
  leaseSeconds: 3600
  renewIntervalSeconds: 300
  autoPause: true
  # One template is selected automatically. With several, set defaultTemplate.
  # defaultTemplate: standard
  templates:
    standard: # your local template name, from prepare-template.py --name standard
      templateID: replace-with-resolved-template-id # returned by E2B build
      cpuCores: 2
      memoryMB: 3072
      diskGi: 20 # minimum available workspace verified by the builder, not a quota
# Grasp leaves image unset and sandbox_memory_mb at 0 to follow this template.
auth:
  apiKeys: [] # Compose injects SANDBOX_GATEWAY_API_KEY as SBGW_API_KEYS
orphanGC:
  enabled: true # deployment choice; program default is false
  intervalSeconds: 300
  minAgeSeconds: 600
