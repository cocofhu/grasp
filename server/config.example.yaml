# Grasp 配置示例。完整配置项、默认值与沙箱/gateway 的区别见 ../CONFIGURATION.md。
#
# 上线形态:deploy 阶段由 CI 从部署者选择的配置源获取此 YAML，写入 ConfigMap，
# 以只读卷挂到 CONFIG_PATH;进程读取它。**不要把真实配置提交进 git / 打进镜像**。
#
# 本地开发:`cp config.example.yaml config.yaml` 后改值即可;或完全不写文件,
# 仅用环境变量(env > 文件 > 默认)。这里的优先级适用于平台服务配置。
#
# 优先级:显式环境变量 > 本文件(经 ConfigMap 下发)> 代码默认值。
# 设置页管理的参数另有数据库覆盖：环境变量 > 设置页保存值 > 本文件 > 默认值。
# 平台服务的高敏密钥生产走 K8s Secret 注入环境变量,不放本文件。
# ACP / Git 运行时凭据只在工作区凭据 UI 管理，不在本文件配置。
#
# 注意:GitLab/代码托管不是平台级配置。仓库地址来自工作流绑定的仓库,
# 凭据来自工作区凭据,按 run 注入对应沙箱;平台本身不依赖任何固定的 GitLab 地址或令牌。

server:
  port: 8080
  # 本文件仅用于 loopback 本地演示。非本地部署改为 production，并通过
  # GRASP_AUTH_USERS 注入自有账号哈希。
  deployment_mode: local-demo
  # 沙箱内 agent / MCP 客户端回连宿主 run 级 grasp-tool MCP 的 base URL。
  # 留空默认 http://host.docker.internal:<port>(本地 Docker / DinD 预览可用)。
  #
  # 部署时务必设为沙箱容器内可达、且已挂载 /mcp/runs/:runId 的 API 基址。
  # 禁止把未挂载 MCP 的前端 SPA 入口域名配到这里。
  #
  # 生产值请显式写 API 入口(示例):
  #   mcp_advertise: "https://approving-api.example.com"
  # DinD/本地请留空以使用 host.docker.internal。
  mcp_advertise: ""

# 浏览器预览暴露策略（全局默认，可在各网关连接上单独覆盖）。
# strategy: auto（默认）| subdomain | none（direct 仅限直连网关在连接级配置）。
# 私有网关（gateway 通道或 private_endpoints: true）配置了 subdomain.base_url 后
# 会签发随机子域名作为 DirectURL（支持新标签打开、取点、浮动对话与分享）；未配置时
# 保持仅 noVNC。production 模式要求 https 且与 public_advertise 分属不同根域。
preview:
  expose:
    strategy: auto
    subdomain:
      base_url: ""

database:
  # SQLite 路径(":memory:" 用于测试)。容器内通常用 /data/grasp.db(挂持久卷)。
  path: "grasp.db"

engine:
  profiles_root: "data/profiles"

sandbox:
  # 沙箱镜像只在 sandbox-gateway 配置（docker/kubernetes 的 image / profiles，
  # E2B 的 defaultTemplate / templates）；Grasp 通过 GET /api/v1/capabilities 读取。
  # 默认控制面地址；直接运行 gateway 默认听 8080，需在两端显式对齐端口。
  gateway_url: http://127.0.0.1:8899
  # 通过 GRASP_SANDBOX_GATEWAY_API_KEY 注入与网关 auth.apiKeys 匹配的 key。
  gateway_api_key: ""
  # 默认 direct。gateway 通道要求网关 API key；预览暴露由 preview.expose / 连接级
  # preview_expose 决定（未配子域名基址时保持仅 noVNC）。沙箱仍须能访问 mcp_advertise。
  gateway_transport: direct
  # 仅表示用户显式意图，不再因 gateway 通道自动覆盖；只影响 auto 策略展开。
  private_endpoints: false
  # 传统主连接的可选预览暴露覆盖（省略则继承全局 preview.expose）。
  # preview_expose:
  #   strategy: subdomain
  #   subdomain:
  #     base_url: https://preview.other-site.example.com
  # 命名网关用于新增后端；默认网关只影响新沙箱，已有沙箱保留原绑定。
  # 网关连接/默认值修改后重启 Grasp。完整示例见根目录 GATEWAY.md。
  gateways: []
  default_gateway: ""
  # 通用环境变量透传(厂商无关):逐条注入沙箱容器。
  # 默认 SKIP_INNER_DOCKER=0(启用 DinD);设为 "1" 则不启动内层 dockerd。
  env: {}
  # ACP 后端非密钥选项(厂商中立):合并进沙箱 Env。密钥请在工作区凭据中配置。
  acp_env: {}
  # Agent 回合没有单轮总时限。节点总时限在画布节点上配置「节点总时限(分钟)」,
  # 累计本节点所有 Agent 回合;不填时按下面的兜底上限。
  # agent_chat_timeout_seconds 已废弃并忽略。
  #
  # Agent 无动作时限(秒):沙箱判定 Agent 既无输出、也无 CPU/IO 活动这么久,
  # 先续跑一次,仍无活动则中断本轮。正在编译、测试、下载的命令算作有活动。
  # 设置页可在运行时修改;用 GRASP_CHAT_IDLE_SEC 设置后页面只读。
  chat_idle_timeout_seconds: 1200
  # 未配置节点总时限的 Agent 节点的兜底上限(小时)。
  agent_node_hard_cap_hours: 24
  # 仅 E2B：模型回合结束且无排队请求达到此时长，保存后释放资源。
  # 页面、IDE、预览和终端访问不续期；会话可在侧栏开启「永不自动回收」。
  # 再次使用时恢复最新成功备份。设置页可修改。Docker/K8s 不因空闲回收。
  idle_ttl_minutes: 360
  # 仅 E2B：模型回合结束 N 分钟后清理沙箱页面缓存并整理内存，把空闲内存还给主机；
  # 持续空闲时每隔 interval 分钟、且缓存超过 min_cache_mb 才再次清理。负数关闭。
  memory_trim_idle_minutes: 10
  memory_trim_interval_minutes: 30
  memory_trim_min_cache_mb: 1024
  # 全局沙箱数量上限，创建和恢复使用同一配额；降低不会终止已有沙箱。
  max_sandboxes: 15
  # 内存覆盖（MiB）：0 跟随网关/所选模板；非零至少 1024。
  # Docker/K8s 受各自 resources.max 限制，E2B 必须与模板 memoryMB 一致。
  # 设置页可改；GRASP_SANDBOX_MEMORY_MB 环境变量优先且锁定设置页。
  sandbox_memory_mb: 0
  # Agent 配置根(config home)在宿主侧的落地基目录,打包后经 gateway
  # config.bundleUrl / SSH 注入沙箱。留空=系统临时目录(本地开发与 K8s 预览均可)。
  work_dir: ""

# VNC preview (sandbox-side Chromium + noVNC; Grasp only proxies WS).
# Always enabled; Settings max_preview_tabs overrides max_tabs at runtime.
# Users connect via /sandbox-vnc/:sandboxId/ws (one desktop and one active app
# preview per sandbox) — never host:6080 / host:9222.
# When auth users are configured (always on outside local-demo), that WS
# path requires a valid Session cookie. Preview HTTP /preview/:runId/...
# stays session-free (iframe credential is runId+nodeId+port).
browser:
  # Global LRU cap on concurrent preview tabs (one per viewer session).
  max_tabs: 16
  # One desktop per sandbox; viewers of the same sandbox share it.
  max_tabs_per_container: 1
  # Idle tab / empty container reclamation (seconds).
  tab_idle_ttl_seconds: 300
  container_idle_ttl_seconds: 600
  # Close an unwatched sandbox preview page after this long; 0 keeps it (and
  # its screen state) for the sandbox's lifetime.
  desktop_idle_ttl_seconds: 0

# 静态账号登录（鉴权始终启用，无 auth.enabled 开关）。下列账号只允许 loopback
# 本地 demo；任何共享、远程或生产部署都必须通过 GRASP_AUTH_USERS 显式替换。
# username 可放 ConfigMap；password_hash 必须经 K8s Secret 注入环境变量
# GRASP_AUTH_USERS（JSON 数组），禁止明文密码进 git / 配置中心。
# 账号变更后需重启 Pod 生效（config 热加载不刷新内存账号表）。
auth:
  session_ttl: 168h
  # 用 scripts/gen-auth-hash.sh 生成自有 bcrypt 哈希；公开示例不携带可登录账号。
  users: []

# 至此静态安全项。secrets_key 是存储加密主密钥(AES-256),用于加密工作区凭据
# 在 DB 里的密文。视作固定盐:设一次后保持不变,轮换会导致已存
# 密文无法解密。生成:`head -c 32 /dev/urandom | base64`。生产建议经 K8s Secret
# 注入环境变量 GRASP_SECRETS_KEY 覆盖本值,不要把真实密钥提交进 git。
# 留空时:非 production 模式在 SQLite 库旁自动生成 secrets.key(随库一起备份);
# production 模式必须显式配置,否则无法保存凭据。./start.sh 会生成并写入 .env。
security:
  secrets_key: ""

# 可选:「用 GitHub 登录」(OAuth Device Flow)添加 github.com 工作区凭据。
# 在 GitHub 注册自己的 OAuth App 并勾选 Enable Device Flow,填其 Client ID;
# 无需 client secret。环境变量 GRASP_GITHUB_OAUTH_CLIENT_ID 优先。留空则只能粘贴 Token。
github:
  oauth_client_id: ""

# Codex ChatGPT 登录由平台统一续期:平台是唯一持有 refresh_token 的地方,
# 沙箱只拿到去掉 refresh_token 的副本。到 auth_base_url 的请求遵循 HTTPS_PROXY。
# 环境变量 GRASP_CODEX_LOGIN_REFRESH_LEAD / _CHECK_INTERVAL / _AUTH_BASE_URL 优先。
codex_login:
  refresh_lead: 96h
  check_interval: 10m
  auth_base_url: https://auth.openai.com

# 文件备份与 E2B 快照共用保留数量；仅保存/停止时产生，始终恢复最新成功版本。
solo_backup:
  keep: 1
