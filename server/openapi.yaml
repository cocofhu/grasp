openapi: 3.0.3
info:
  title: Grasp Platform API (partial)
  version: 0.1.0
  description: |
    Minimal OpenAPI contract for platform list endpoints.

    **Pagination pattern (shared):** GET /api/artifacts, GET /api/runs,
    GET /api/gates and GET /api/projects/{id}/audit always return the paginated
    envelope `{ items, total, page, pageSize, hasMore }` as implemented in
    `internal/handlers/pagination.go` (`parsePagination`, `paginatedResponse`).
    Omitted `page` / `pageSize` default to `1` / `20`; `maxPageSize=100`;
    `hasMore = page × pageSize < total`.

servers:
  - url: /api
    description: Platform HTTP API (session cookie or Bearer workflow API key)

tags:
  - name: artifacts
    description: Platform-wide artifact catalog
  - name: agents
    description: Agent Studio export/import (single agent and org-folder)
  - name: workflows
    description: Workflow creation and lifecycle

paths:
  /workflows/from-baseline:
    post:
      operationId: createWorkflowFromBaseline
      tags: [workflows]
      summary: Create a published workflow from the embedded default baseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBaselineWorkflowRequest'
      responses:
        '201':
          description: Published workflow created with the requested name and showOnHome=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineWorkflow'
        '400':
          description: Empty name, missing project, or no repository URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A workflow with the same name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /runs/{id}/gates/{nodeId}/primary-artifacts:
    get:
      operationId: listGatePrimaryArtifacts
      tags: [artifacts]
      summary: List primary artifacts for a pending gate
      description: |
        Returns the whitelist of primary artifacts for a `waiting_human` unresolved
        gate, derived from body_template `{{nodes.*.outputs.*}}` and `artifact("…")`.
        Each item includes `kind` and `readonly`
        (true for non-text kinds such as image). Auth matches ResumeGate (session).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Primary artifact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        kind: { type: string, description: "json|html|markdown|text|image" }
                        readonly: { type: boolean, description: "true for non-text primaries (e.g. image)" }
                        nodeId: { type: string }
                        outputKey: { type: string }
        '400':
          description: Gate not pending / run not waiting_human
  /runs/{id}/gates/{nodeId}/artifacts/{name}:
    put:
      operationId: saveGateArtifact
      tags: [artifacts]
      summary: Save a gate-scoped primary artifact (human edit)
      description: |
        Validates content with the same Parse*/basic rules as Agent `set_*`,
        upserts the artifact store, syncs the bound upstream iteration outputs
        snapshot, appends an `artifact_edit` trace event, and returns the
        normalized `content` plus ETag / updatedAt metadata. Optional `If-Match`
        enables conflict detection (409). Rejects non-primary names and non-text
        (e.g. image) primaries. Does not approve/resume the gate.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: Saved
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  kind: { type: string }
                  sizeBytes: { type: integer }
                  updatedAt: { type: string, format: date-time }
                  etag: { type: string }
                  nodeId: { type: string }
                  content:
                    type: string
                    description: Normalized content actually stored (may differ from request after Parse*)
        '400':
          description: Validation / not primary / not pending
        '409':
          description: If-Match conflict (external update)
  /artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: List platform artifacts (paginated)
      description: |
        Returns artifacts across all runs for the Artifacts view and integrations,
        always as the paginated envelope `{ items, total, page, pageSize, hasMore }`.

        **Pagination unit:**
        - Default (no `groupBy`, or any value other than `run`): `pageSize` /
          `total` count **artifact rows**; `items` is a slice of artifacts.
        - `groupBy=run` (opt-in, ArtifactsView L2): `pageSize` / `total` count
          **Runs**; `items` is the flat list of **all** artifacts belonging to
          the Runs on this page (whole-Run expansion). Therefore `items.length`
          may be greater than `pageSize` when a Run has many artifacts.
          Runs are ordered by `MAX(artifacts.created_at)` descending.
          When `q` is set, a Run qualifies if any of its artifacts match; the
          expand step drops `q` so non-matching files in that Run are still
          returned (wf / project filters still apply).

        **Filtering:**
        - `wf`: restrict to a workflow ID, or `__unnamed__` for artifacts whose
          `workflow_id` is NULL or empty string.
        - `q`: case-insensitive substring search across `artifacts.name`,
          `artifacts.node_id`, and `runs.title` (via LEFT JOIN).

        **List item shape:** `items` omit heavy `content`; `runTitle` is
        populated from `runs.title` when non-empty. Empty results normalize
        `items` to `[]` (never JSON `null`).

        Pagination validation matches `/api/runs` and `/api/gates`: invalid
        `page`/`pageSize` or `pageSize > 100` → HTTP 400.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/WfQuery'
        - $ref: '#/components/parameters/ArtifactSearchQuery'
        - $ref: '#/components/parameters/ArtifactGroupByQuery'
      responses:
        '200':
          description: Paginated artifact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPaginatedResponse'
              examples:
                paginated:
                  summary: Default — by artifact
                  value:
                    items:
                      - id: art-abc123
                        runId: run-1
                        nodeId: plan
                        workflowId: wf-product
                        name: plan.json
                        kind: json
                        sizeBytes: 1024
                        createdAt: '2026-07-12T00:00:00Z'
                        runTitle: Sprint Planning
                    total: 47
                    page: 1
                    pageSize: 20
                    hasMore: true
                paginatedByRun:
                  summary: groupBy=run (L2 — by Run; items may exceed pageSize)
                  value:
                    items:
                      - id: art-abc123
                        runId: run-1
                        nodeId: plan
                        workflowId: wf-product
                        name: plan.json
                        kind: json
                        sizeBytes: 1024
                        createdAt: '2026-07-12T00:00:00Z'
                        runTitle: Sprint Planning
                      - id: art-def456
                        runId: run-1
                        nodeId: research
                        workflowId: wf-product
                        name: research.json
                        kind: json
                        sizeBytes: 2048
                        createdAt: '2026-07-12T00:01:00Z'
                        runTitle: Sprint Planning
                    total: 12
                    page: 1
                    pageSize: 20
                    hasMore: false
                emptyPage:
                  summary: No matches
                  value:
                    items: []
                    total: 0
                    page: 1
                    pageSize: 20
                    hasMore: false
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pageSizeTooLarge:
                  value:
                    error: pageSize must be ≤ 100
        '401':
          description: Missing or invalid session / API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}/agents/export:
    get:
      operationId: exportProjectAgents
      tags: [agents]
      summary: Export every Agent of a project as one ZIP
      description: |
        Downloads a project package (`project.json` with `kind: project-agents`,
        `schemaVersion: 1` + `agents/{name}/`) containing every Agent whose home
        project is `id`. Filename is `<project name>-agents.zip`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ZIP attachment
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Package too large
        '401':
          description: Unauthenticated
        '404':
          description: Project not found

  /projects/{id}/agents/import:
    post:
      operationId: importProjectAgents
      tags: [agents]
      summary: Import a project Agent package (atomic)
      description: |
        Multipart import of a `project-agents` ZIP (max 64MiB). Every imported
        Agent is bound to project `id`. `mode` is `rename` (default, name
        conflicts get a new name) or `overwrite` (only Agents already in this
        project may be overwritten). Single-agent ZIPs are rejected. Failures
        roll back the whole import.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [rename, overwrite]
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items: { type: string }
                  overwritten:
                    type: array
                    items: { type: string }
                  renamed:
                    type: object
                    additionalProperties: { type: string }
        '400':
          description: Invalid package, single-agent ZIP, oversize, foreign-project overwrite, or validation
        '401':
          description: Unauthenticated
        '404':
          description: Project not found

  /agents/{name}/export:
    get:
      operationId: exportAgent
      tags: [agents]
      summary: Export one Agent as a ZIP
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ZIP attachment
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthenticated
        '404':
          description: Agent not found

  /agents/import:
    post:
      operationId: importAgent
      tags: [agents]
      summary: Import a single-agent ZIP
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targetName, projectId]
              properties:
                file:
                  type: string
                  format: binary
                targetName:
                  type: string
                projectId:
                  type: string
                  description: Home project of the imported Agent (required)
                mode:
                  type: string
                  enum: [create, overwrite]
      responses:
        '200':
          description: Imported agent
        '400':
          description: Invalid ZIP, name, missing / unknown projectId, or agent.json without a valid acpBackend
        '401':
          description: Unauthenticated

components:
  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: |
        1-based page index. Defaults to `1`.
        Must be a positive integer (≥ 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      description: |
        Page size. Defaults to `20`.
        Maximum `100`; values above 100 return HTTP 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WfQuery:
      name: wf
      in: query
      required: false
      description: |
        Filter by workflow ID. Use the sentinel value `__unnamed__` to list
        artifacts with no workflow (`workflow_id` IS NULL or empty).
      schema:
        type: string
        example: wf-product
    ArtifactSearchQuery:
      name: q
      in: query
      required: false
      description: |
        Case-insensitive substring search against artifact `name`, `nodeId`,
        and associated run `title` (SQL `LOWER LIKE` with `%` wildcards).
        With `groupBy=run`, `q` selects which Runs qualify; expansion returns
        the full Run (see operation description).
      schema:
        type: string
        example: plan
    ArtifactGroupByQuery:
      name: groupBy
      in: query
      required: false
      description: |
        Pagination grouping mode.
        Omit or use any value other than `run` to page by artifact row
        (`total` / `pageSize` = artifact count).
        Set to `run` to page by Run (`total` / `pageSize` = Run count;
        `items` = flat whole-Run artifact lists for the page).
      schema:
        type: string
        enum: [run]
        example: run

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    CreateBaselineWorkflowRequest:
      type: object
      required: [projectId, name, repos]
      properties:
        projectId:
          type: string
        name:
          type: string
          minLength: 1
          description: Required workflow display name; trimmed and unique within the project
        repos:
          type: array
          minItems: 1
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
              name:
                type: string
              branch:
                type: string

    BaselineWorkflow:
      type: object
      required: [id, projectId, name, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [published]
        showOnHome:
          type: boolean
          description: Always true on a successful from-baseline create

    ArtifactListItem:
      type: object
      description: |
        Lightweight artifact metadata for list endpoints. Does **not** include
        `content` (use GET /artifacts/{id}/content for full body).
      properties:
        id:
          type: string
        runId:
          type: string
        nodeId:
          type: string
        workflowId:
          type: string
        workflowName:
          type: string
        name:
          type: string
        kind:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        runTitle:
          type: string
          description: From LEFT JOIN runs.title; omitted when empty
      required: [id, runId, nodeId, name, kind, sizeBytes, createdAt]

    PaginatedResponseBase:
      type: object
      description: |
        Shared pagination envelope used by GET /api/artifacts, GET /api/runs,
        GET /api/gates and GET /api/projects/{id}/audit (see pagination.go).
      properties:
        total:
          type: integer
          description: Total matching rows before paging
        page:
          type: integer
          description: Current 1-based page
        pageSize:
          type: integer
          description: Requested page size (default 20, max 100)
        hasMore:
          type: boolean
          description: True when `page × pageSize < total`
      required: [total, page, pageSize, hasMore]

    ArtifactPaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseBase'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactListItem'
              description: Always an array; empty results are `[]` not `null`
          required: [items]
