# Overlay on compose.release.yaml for the restart-reattach e2e: isolated data
# dirs (never the developer's .localdata) and a single run slot so a second run
# stays queued across the restart.
services:
  gateway:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GRASP_RESTART_DATA_ROOT:?restart fixture requires its own data root}/gateway:/data
  grasp:
    environment:
      GRASP_MAX_RUNS: "1"
    volumes:
      - ${GRASP_RESTART_DATA_ROOT:?restart fixture requires its own data root}/db:/data
      - ${GRASP_RESTART_DATA_ROOT:?restart fixture requires its own data root}/app-data:/app/data
