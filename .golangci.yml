# Shared golangci-lint config for server, sandbox-gateway/gateway, and
# sandbox-gateway/sandbox. Blocking CI gate.
# staticcheck stays on SA* and S1*. Production code also runs errcheck and
# unused. _test.go stays excluded from all of these linters.
version: "2"

linters:
  default: none
  enable:
    - staticcheck
    - errcheck
    - unused
  settings:
    staticcheck:
      checks:
        - "SA*"
        - "S1*"
  exclusions:
    paths:
      - _test\.go$
