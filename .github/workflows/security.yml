# Minimal security scan baseline (bypass path — does not modify ci-*).
# CodeQL: results in Security → Code scanning / PR Checks (not branch-protection required).
# analyze job green ≠ default branch has zero open alerts — spot-check after merge.
# Residual-prone patterns (do not "boolean-sanitize" and assume taint is cleared):
#   incomplete multi-char HTML strip, DOM reinterpret after encode — see
#   web/src/lib/highlightJson.test.ts and CONTRIBUTING.md "Security scans".
# npm audit: high+ fails the job (web highs cleared via audit fix + overrides.minimatch).
# gitleaks: fail-on-leak after .gitleaks.toml allowlist for documented placeholders.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for CodeQL
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/powershell /usr/share/swift || true
          df -h
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: "1.25.x"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Vendored upstream builds (marked / DOMPurify) are pinned releases, not our code to patch.
          config: |
            paths-ignore:
              - sandbox-gateway/sandbox/web/static/js/third_party
      - name: Manual Go build (fallback when autobuild is skipped)
        if: matrix.build-mode == 'manual'
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          (cd server && go build ./...)
          (cd sandbox-gateway/gateway && go build ./...)
          (cd sandbox-gateway/sandbox && go build ./...)
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit (high+)
        # Hardened after web audit high=0 (audit fix + overrides.minimatch ^10.2.5).
        # Use the official registry (mirror audit APIs are often unimplemented).
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
