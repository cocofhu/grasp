name: ci-gateway

# Path-filtered suite for sandbox-gateway/gateway (control plane).
# Keeps PR CI light: go vet + unit tests with a 90% coverage gate,
# plus a Dockerfile smoke build so go.mod / image Go baseline drift fails the PR.
# Image publish remains in publish-gateway (v* tags); not merged into ci-sandbox.
on:
  push:
    paths:
      - "sandbox-gateway/gateway/**"
      - "sandbox-gateway/Dockerfile"
      - "sandbox-gateway/scripts/cover-check.sh"
      - ".github/workflows/ci-gateway.yml"
      - ".github/scripts/coverage-badge-color.sh"
      - ".github/scripts/publish-coverage-badge.sh"
      - ".golangci.yml"
  pull_request:
    paths:
      - "sandbox-gateway/gateway/**"
      - "sandbox-gateway/Dockerfile"
      - "sandbox-gateway/scripts/cover-check.sh"
      - ".github/workflows/ci-gateway.yml"
      - ".github/scripts/coverage-badge-color.sh"
      - ".github/scripts/publish-coverage-badge.sh"
      - ".golangci.yml"

jobs:
  gateway:
    runs-on: ubuntu-latest
    # contents:write only used to update the orphan coverage-badges branch endpoint.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sandbox-gateway/gateway
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: sandbox-gateway/gateway/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: sandbox-gateway/gateway
          args: --config=${{ github.workspace }}/.golangci.yml
      - run: go vet ./...
      - name: Gateway Go coverage gate
        id: cover
        working-directory: sandbox-gateway
        run: ./scripts/cover-check.sh gateway 90
      - name: Publish coverage-gateway badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        continue-on-error: true
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pct="${{ steps.cover.outputs.coverage_pct }}"
          if [[ -z "$pct" ]]; then
            echo "no coverage_pct from cover-check; skip badge publish"
            exit 0
          fi
          color="$(./.github/scripts/coverage-badge-color.sh "$pct")"
          ./.github/scripts/publish-coverage-badge.sh \
            coverage-gateway.json \
            coverage-gateway \
            "$pct" \
            "$color"

  # Smoke-build sandbox-gateway/Dockerfile (same context/file as publish-gateway).
  # push:false — PR gate only; catches go.mod vs image Go baseline drift before merge.
  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build sandbox-gateway Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./sandbox-gateway
          file: ./sandbox-gateway/Dockerfile
          push: false
