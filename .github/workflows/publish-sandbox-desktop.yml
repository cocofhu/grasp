name: publish-sandbox-desktop

# Desktop image variant (sandbox-gateway/sandbox/Dockerfile.desktop) on top of
# the published default sandbox image. Tags: <version>-desktop on release
# tags, rolling `desktop` on stable releases, sha-<sha>-desktop always.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_image:
        description: "Default sandbox image to build on"
        required: false
        default: "ghcr.io/cocofhu/universal-sandbox:latest"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Base image
        id: base
        env:
          INPUT_BASE: ${{ inputs.base_image }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          base="${INPUT_BASE:-ghcr.io/cocofhu/universal-sandbox:latest}"
          if [ "$REF_TYPE" = tag ]; then
            base="ghcr.io/cocofhu/universal-sandbox:${REF_NAME#v}"
            # publish-sandbox builds the base from the same tag; wait for it.
            for _ in $(seq 1 120); do
              docker manifest inspect "$base" >/dev/null 2>&1 && break
              sleep 60
            done
            docker manifest inspect "$base" >/dev/null
          fi
          echo "image=$base" >>"$GITHUB_OUTPUT"
      - name: Blender MCP source
        id: blmcp
        run: |
          ref="$(sed -n 's/^ARG BLENDER_MCP_REF=//p' sandbox-gateway/sandbox/Dockerfile.desktop)"
          git clone -q https://projects.blender.org/lab/blender_mcp.git "$RUNNER_TEMP/blender_mcp"
          git -C "$RUNNER_TEMP/blender_mcp" checkout -q "$ref"
          echo "dir=$RUNNER_TEMP/blender_mcp" >>"$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cocofhu/universal-sandbox
          flavor: |
            latest=false
            suffix=-desktop,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha
            type=raw,value=desktop,suffix=,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./sandbox-gateway/sandbox
          file: ./sandbox-gateway/sandbox/Dockerfile.desktop
          load: true
          tags: universal-sandbox:desktop-smoke
          build-contexts: |
            blender_mcp=${{ steps.blmcp.outputs.dir }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
      - name: Smoke
        run: ./scripts/check-desktop-image.sh universal-sandbox:desktop-smoke
      - name: Runtime bundle
        run: |
          docker buildx build -f server/Dockerfile --target sandbox-runtime-export \
            --output type=local,dest="$RUNNER_TEMP/runtime" .
      - name: Desktop E2E (shell, launcher, desktop MCP, interlock, Blender MCP)
        run: ./sandbox-gateway/scripts/test-desktop-e2e.sh universal-sandbox:desktop-smoke "$RUNNER_TEMP/runtime/sandbox-runtime.tgz"
      - name: Browser-mode baseline (default image)
        env:
          BASE: ${{ steps.base.outputs.image }}
        run: ./sandbox-gateway/scripts/test-desktop-e2e.sh "$BASE" "$RUNNER_TEMP/runtime/sandbox-runtime.tgz" browser
      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag universal-sandbox:desktop-smoke "$tag"
            docker push "$tag"
          done <<<"$TAGS"
