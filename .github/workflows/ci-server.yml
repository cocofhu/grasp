name: ci-server

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
      - ".github/scripts/coverage-badge-color.sh"
      - ".github/scripts/publish-coverage-badge.sh"
      - ".golangci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
      - ".github/scripts/coverage-badge-color.sh"
      - ".github/scripts/publish-coverage-badge.sh"
      - ".golangci.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      migration-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: migration-ci-root
          MYSQL_DATABASE: grasp_workspace_migration_test
          MYSQL_USER: migration
          MYSQL_PASSWORD: migration-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=migration-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    # contents:write only used to update the orphan coverage-badges branch endpoint.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: server
          args: --config=${{ github.workspace }}/.golangci.yml
      - run: go vet ./...
      - run: go run ./cmd/gen-configdoc -out CONFIGURATION.md -check
      - run: go test ./...
      - name: Verify MySQL workspace migration and rollback
        env:
          GRASP_WORKSPACE_MIGRATION_TEST_DSN: "migration:migration-ci@tcp(127.0.0.1:3306)/grasp_workspace_migration_test?charset=utf8mb4&parseTime=true&loc=UTC"
        run: go test ./internal/workspacemigration/ -count=1 -run '^TestMySQLMigration$' -v
      - name: Server Go coverage gate
        id: cover
        run: ./scripts/cover-check-server.sh 90
      - name: Publish coverage-server badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        continue-on-error: true
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pct="${{ steps.cover.outputs.coverage_pct }}"
          if [[ -z "$pct" ]]; then
            echo "no coverage_pct from cover-check; skip badge publish"
            exit 0
          fi
          color="$(./.github/scripts/coverage-badge-color.sh "$pct")"
          ./.github/scripts/publish-coverage-badge.sh \
            coverage-server.json \
            coverage-server \
            "$pct" \
            "$color"
      - name: e2e fake runtime
        run: go test ./internal/runtime/ -count=1 -run 'TestRunAgent|TestReact'
