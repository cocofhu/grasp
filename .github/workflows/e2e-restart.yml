name: e2e-restart

# Real Grasp, Docker and OpenCode exercise reattachment. The local model
# fixture supplies the exact shell and MCP calls that straddle the restart.
on:
  push:
    paths:
      - "server/**"
      - "sandbox-gateway/sandbox/**"
      - "sandbox-gateway/scripts/mock-agent-model.mjs"
      - "compose.release.yaml"
      - ".github/workflows/e2e-restart.yml"
  pull_request:
    paths:
      - "server/**"
      - "sandbox-gateway/sandbox/**"
      - "sandbox-gateway/scripts/mock-agent-model.mjs"
      - "compose.release.yaml"
      - ".github/workflows/e2e-restart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-restart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart-reattach:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v4
      # The checkout's runtime bundle may require a newer IMAGE_LEVEL than the
      # published release sandbox. Build both sides of that contract together.
      - name: Free disk space for the loaded images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Build matching sandbox image
        uses: docker/build-push-action@v7
        with:
          context: ./sandbox-gateway/sandbox
          file: ./sandbox-gateway/sandbox/Dockerfile
          load: true
          tags: universal-sandbox:e2e-restart
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            USE_CN_MIRROR=false
          cache-from: type=gha,scope=sandbox-image
      - name: Verify sandbox image contract
        run: |
          expected_level="$(tr -d '[:space:]' <sandbox-gateway/sandbox/IMAGE_LEVEL)"
          actual_level="$(docker run --rm --entrypoint cat universal-sandbox:e2e-restart /etc/grasp-image-level)"
          test "$actual_level" -ge "$expected_level"
          docker run --rm --entrypoint bash universal-sandbox:e2e-restart -lc 'command -v opencode && command -v dsh'
      - name: Build grasp image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: grasp:e2e
          cache-from: type=gha,scope=grasp-e2e
          cache-to: type=gha,mode=max,scope=grasp-e2e
      - name: Restart reattach e2e
        working-directory: server
        env:
          GRASP_IMAGE: grasp:e2e
          SANDBOX_IMAGE: universal-sandbox:e2e-restart
          GRASP_SANDBOX_IMAGE: universal-sandbox:e2e-restart
          GRASP_RESTART_MODEL_URL: http://127.0.0.1:19117
        run: |
          mkdir -p ../e2e-artifacts
          node ../sandbox-gateway/scripts/mock-agent-model.mjs --listen 0.0.0.0 --port 19117 \
            --report-file ../e2e-artifacts/model-report.json >../e2e-artifacts/model.log 2>&1 &
          model_pid=$!
          trap 'kill "$model_pid" 2>/dev/null || true' EXIT
          for ((attempt = 0; attempt < 30; attempt++)); do
            if curl -fsS "$GRASP_RESTART_MODEL_URL/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$GRASP_RESTART_MODEL_URL/health" >/dev/null
          go test -tags e2ereal ./e2e -run TestRestartReattach -v -count=1 -timeout 45m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-restart-logs
          path: e2e-artifacts/
          retention-days: 14
