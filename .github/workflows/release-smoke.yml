name: release-smoke

# Digest-pinned clean-Linux smoke.
# Trigger: workflow_dispatch only (Actions → release-smoke → Run workflow).
# Intentionally NOT on push tags: beta/v* tags without release secrets would fail.
# Intentionally NOT on pull_request: pulls multi-GB digest images via secrets
# GRASP_IMAGE / SANDBOX_GATEWAY_IMAGE / SANDBOX_IMAGE — do not make this a
# per-PR required check. Optional weekly/nightly schedule is a future maintainer
# choice, not a merge gate.
# Local: export the three digest refs, then ./release-smoke.sh (see CONTRIBUTING).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published image version, without the leading v
        required: true
        default: 4.0.3

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Resolve published image digests
        run: |
          version='${{ inputs.version }}'
          test -n "$version"
          pull_digest() {
            image="$1:$version"
            docker pull "$image" >&2
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            test -n "$digest"
            printf '%s\n' "$digest"
          }
          GRASP_IMAGE="$(pull_digest ghcr.io/cocofhu/grasp)"
          SANDBOX_GATEWAY_IMAGE="$(pull_digest ghcr.io/cocofhu/sandbox-gateway)"
          SANDBOX_IMAGE="$(pull_digest ghcr.io/cocofhu/universal-sandbox)"
          {
            printf 'GRASP_IMAGE=%s\n' "$GRASP_IMAGE"
            printf 'SANDBOX_GATEWAY_IMAGE=%s\n' "$SANDBOX_GATEWAY_IMAGE"
            printf 'SANDBOX_IMAGE=%s\n' "$SANDBOX_IMAGE"
          } >> "$GITHUB_ENV"
          export GRASP_IMAGE SANDBOX_GATEWAY_IMAGE SANDBOX_IMAGE
          ./release-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
