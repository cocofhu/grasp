name: release-smoke

# Digest-pinned clean-Linux smoke.
# Trigger: workflow_dispatch only (Actions → release-smoke → Run workflow).
# Intentionally NOT on push tags: beta/v* tags without release secrets would fail.
# Intentionally NOT on pull_request: pulls multi-GB digest images via secrets
# GRASP_IMAGE / SANDBOX_GATEWAY_IMAGE / SANDBOX_IMAGE — do not make this a
# per-PR required check. Optional weekly/nightly schedule is a future maintainer
# choice, not a merge gate.
# Local: export the three digest refs, then ./release-smoke.sh (see CONTRIBUTING).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Require digest-pinned images
        env:
          GRASP_IMAGE: ${{ secrets.GRASP_IMAGE }}
          SANDBOX_GATEWAY_IMAGE: ${{ secrets.SANDBOX_GATEWAY_IMAGE }}
          SANDBOX_IMAGE: ${{ secrets.SANDBOX_IMAGE }}
        run: |
          test -n "$GRASP_IMAGE"
          test -n "$SANDBOX_GATEWAY_IMAGE"
          test -n "$SANDBOX_IMAGE"
          export GRASP_IMAGE SANDBOX_GATEWAY_IMAGE SANDBOX_IMAGE
          ./release-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
