name: ci-web

on:
  push:
    paths: ["web/**", ".github/workflows/ci-web.yml", ".github/scripts/coverage-badge-color.sh", ".github/scripts/publish-coverage-badge.sh"]
  pull_request:
    paths: ["web/**", ".github/workflows/ci-web.yml", ".github/scripts/coverage-badge-color.sh", ".github/scripts/publish-coverage-badge.sh"]

jobs:
  web:
    runs-on: ubuntu-latest
    # contents:write only used to update the orphan coverage-badges branch endpoint.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx vue-tsc --noEmit
      - run: npm test -- --coverage
      - run: npm run build
      - name: Export web Lines coverage
        id: coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        continue-on-error: true
        run: |
          set -euo pipefail
          summary="coverage/coverage-summary.json"
          if [[ ! -f "$summary" ]]; then
            echo "missing $summary; skip badge publish"
            exit 1
          fi
          pct="$(jq -r '.total.lines.pct' "$summary")"
          if [[ -z "$pct" || "$pct" == "null" ]]; then
            echo "could not parse total.lines.pct; skip badge publish"
            exit 1
          fi
          color="$(../.github/scripts/coverage-badge-color.sh "$pct")"
          {
            echo "pct=$pct"
            echo "color=$color"
            echo "ok=true"
          } >>"$GITHUB_OUTPUT"
          echo "web Lines coverage=${pct}% color=${color}"
      - name: Publish coverage-web badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.coverage.outputs.ok == 'true'
        continue-on-error: true
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/publish-coverage-badge.sh \
            coverage-web.json \
            coverage-web \
            "${{ steps.coverage.outputs.pct }}" \
            "${{ steps.coverage.outputs.color }}"

  # Critical-path Playwright subset (mock vite.e2e harness; no real backend).
  # Parallel with `web`. Minimal permissions (no coverage-badge write).
  # Merge blocking: require `web`, `web-e2e`, and `web-gate` on protected branches
  # when this workflow runs (path-filtered; non-web PRs do not trigger ci-web).
  web-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical-path e2e
        run: npm run test:e2e:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-failure
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Fan-in gate so a red web or web-e2e cannot leave a skipped "required" check
  # treated as success. Always runs; fails when any needed job failed/cancelled.
  web-gate:
    name: web-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [web, web-e2e]
    permissions:
      contents: read
    steps:
      - name: Require web + web-e2e success
        run: |
          set -euo pipefail
          web_result='${{ needs.web.result }}'
          e2e_result='${{ needs.web-e2e.result }}'
          echo "web=${web_result} web-e2e=${e2e_result}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
             || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::web-gate failed (web=${web_result}, web-e2e=${e2e_result})"
            exit 1
          fi
          if [[ "$web_result" != "success" || "$e2e_result" != "success" ]]; then
            echo "::error::web-gate expected success (web=${web_result}, web-e2e=${e2e_result})"
            exit 1
          fi
          echo "web-gate OK"
