name: ci

# Always-on entry point for branch protection.
#
# - `gate`: repo-wide cheap checks (unchanged name; may already be required).
# - `changes`: one paths-filter decides which jobs below run on a PR. On push
#   to main everything runs.
# - `go-hygiene` / `go-race` / `server-image`: cross-module checks.
# - `ci-required`: single fan-in check. Fails when any job above failed or was
#   cancelled, then waits for the path-filtered sibling workflows (ci-server,
#   ci-gateway, ci-sandbox, ci-web, ci-docs) of the same commit and fails when
#   any of them did not succeed. Skipped / not triggered = not affected = OK.
#   Require only `ci-required` (plus `gate` if desired) in branch protection.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.10"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Gate
        run: |
          echo "Branch protection gate OK."
          echo "server/ → ci-server; web/ → ci-web; sandbox-gateway/sandbox|scripts → ci-sandbox; sandbox-gateway/gateway → ci-gateway; docs/ → ci-docs."
      - name: Assert no Approving brand remnants
        run: node scripts/assert-no-approving-brand.mjs
      - name: actionlint
        run: ./.github/scripts/actionlint.sh
      - name: shellcheck (error)
        run: ./.github/scripts/shellcheck-error.sh

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
      gateway: ${{ github.event_name != 'pull_request' || steps.filter.outputs.gateway == 'true' }}
      sandbox: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sandbox == 'true' }}
      server_image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server_image == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              - "server/**"
              - "web/src/data/**"
              - ".github/workflows/ci.yml"
            gateway:
              - "sandbox-gateway/gateway/**"
              - ".github/workflows/ci.yml"
            sandbox:
              - "sandbox-gateway/sandbox/**"
              - ".github/workflows/ci.yml"
            server_image:
              - "server/**"
              - "web/**"
              - "sandbox-gateway/sandbox/**"
              - "scripts/build-sandbox-runtime.sh"
              - "scripts/assert-no-approving-brand.mjs"
              - ".dockerignore"
              - ".github/workflows/ci.yml"

  # gofmt + go mod tidy + generated-code drift, per Go module.
  go-hygiene:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.sandbox == 'true'
    name: go-hygiene (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: server, dir: server, key: server}
          - {name: gateway, dir: sandbox-gateway/gateway, key: gateway}
          - {name: sandbox, dir: sandbox-gateway/sandbox, key: sandbox}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.key] == 'true'
      - uses: actions/setup-go@v7
        if: needs.changes.outputs[matrix.key] == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: gofmt
        if: needs.changes.outputs[matrix.key] == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt needed (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        if: needs.changes.outputs[matrix.key] == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "::error::run go mod tidy in ${{ matrix.dir }}"; exit 1; }
      - name: Generated code drift (gen-nodereg)
        if: needs.changes.outputs[matrix.key] == 'true' && matrix.name == 'server'
        run: |
          go generate ./internal/nodereg/
          git diff --exit-code || { echo "::error::generated files are stale: run go generate ./internal/nodereg/ in server/"; exit 1; }

  # Concurrency-heavy run / sandbox / bridge code: race detector per module.
  # server is split so no single job runs much over ~10 minutes.
  go-race:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.sandbox == 'true'
    name: go-race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: server-core, dir: server, key: server, pkgs: "./internal/engine/... ./internal/sandbox/... ./internal/runtime/... ./internal/services/... ./internal/chatsession/..."}
          - {name: server-handlers, dir: server, key: server, pkgs: "./internal/handlers/..."}
          - {name: server-rest, dir: server, key: server, pkgs: "REST"}
          - {name: gateway, dir: sandbox-gateway/gateway, key: gateway, pkgs: "./..."}
          - {name: sandbox, dir: sandbox-gateway/sandbox, key: sandbox, pkgs: "./..."}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.key] == 'true'
      - uses: actions/setup-go@v7
        if: needs.changes.outputs[matrix.key] == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: go test -race
        if: needs.changes.outputs[matrix.key] == 'true'
        env:
          CGO_ENABLED: "1"
          PKGS: ${{ matrix.pkgs }}
        run: |
          set -euo pipefail
          if [[ "$PKGS" == "REST" ]]; then
            PKGS="$(go list ./... | grep -vE '/internal/(engine|sandbox|runtime|services|handlers|chatsession)(/|$)' | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086 # PKGS is a space-separated package list
          go test -race -count=1 -timeout 25m $PKGS

  # Build-only of the Grasp server+web image (same context/file as
  # publish-image). No push, no secrets, so fork PRs run it too.
  server-image:
    needs: changes
    if: needs.changes.outputs.server_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server/Dockerfile (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=grasp-server-image
            type=gha,scope=grasp-e2e
          cache-to: type=gha,mode=max,scope=grasp-server-image

  ci-required:
    name: ci-required
    if: always()
    needs: [gate, changes, go-hygiene, go-race, server-image]
    runs-on: ubuntu-latest
    # Waits for ci-sandbox, whose image job may take up to 180 minutes.
    timeout-minutes: 200
    permissions:
      actions: read
      contents: read
    steps:
      - name: Jobs in this workflow
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::a job in this workflow failed or was cancelled"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Path-filtered sibling workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          WORKFLOWS: ci-server,ci-gateway,ci-sandbox,ci-web,ci-docs
        run: ./.github/scripts/wait-workflows.sh
