name: ci-agent-e2e

# No repository/vendor secrets. Every product tool participates in a real
# Docker sandbox built from this checkout; native CLI coverage and
# proprietary-platform doubles are identified in the report.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'sandbox-gateway/gateway/**'
      - 'sandbox-gateway/sandbox/**'
      - 'sandbox-gateway/scripts/**'
      - 'scripts/build-sandbox-runtime.sh'
      - 'web/src/components/agent/**'
      - 'web/src/components/solo/**'
      - 'web/src/lib/agent/**'
      - 'web/src/lib/solo/**'
      - 'web/src/lib/api/clients/soloClient.ts'
      - 'AGENTS.md'
      - '.github/workflows/ci-agent-e2e.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'sandbox-gateway/gateway/**'
      - 'sandbox-gateway/sandbox/**'
      - 'sandbox-gateway/scripts/**'
      - 'scripts/build-sandbox-runtime.sh'
      - 'web/src/components/agent/**'
      - 'web/src/components/solo/**'
      - 'web/src/lib/agent/**'
      - 'web/src/lib/solo/**'
      - 'web/src/lib/api/clients/soloClient.ts'
      - 'AGENTS.md'
      - '.github/workflows/ci-agent-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-switching:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOPROXY: https://proxy.golang.org|direct
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_ASKPASS: /bin/false
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            server/go.sum
            sandbox-gateway/gateway/go.sum
            sandbox-gateway/sandbox/go.sum
      - name: Mock model and complete-matrix contracts
        run: |
          node --test sandbox-gateway/scripts/mock-agent-model.test.mjs sandbox-gateway/scripts/mock-chat-model.test.mjs sandbox-gateway/scripts/agent-platform-wire-fixture.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s sandbox-gateway/scripts -p 'test_agent_switching_test.py'
      - name: Free disk space for the sandbox image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Build sandbox image from this checkout
        uses: docker/build-push-action@v7
        with:
          context: ./sandbox-gateway/sandbox
          file: ./sandbox-gateway/sandbox/Dockerfile
          load: true
          tags: universal-sandbox:agent-e2e
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            USE_CN_MIRROR=false
          cache-from: type=gha,scope=sandbox-image
      - name: Install platform wire doubles and verify every native CLI
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/agent-e2e-artifacts"
          docker build --progress=plain --build-arg SANDBOX_IMAGE=universal-sandbox:agent-e2e \
            -f sandbox-gateway/scripts/agent-e2e-sandbox.Dockerfile -t grasp-agent-e2e-sandbox:ci \
            sandbox-gateway/scripts 2>&1 | tee "$RUNNER_TEMP/agent-e2e-artifacts/sandbox-image.log"
      - name: Build real server, gateway and runtime from this checkout
        run: |
          (cd server && go build -o "$RUNNER_TEMP/grasp-agent-server" ./cmd/server)
          (cd sandbox-gateway/gateway && go build -o "$RUNNER_TEMP/grasp-agent-gateway" ./cmd/server)
          ./scripts/build-sandbox-runtime.sh "$RUNNER_TEMP/grasp-agent-runtime"
      - name: All tools, all directed switches, models, reasoning and native MCP
        run: >-
          python3 sandbox-gateway/scripts/test-agent-switching.py
          --server "$RUNNER_TEMP/grasp-agent-server"
          --gateway "$RUNNER_TEMP/grasp-agent-gateway"
          --runtime-bundle "$RUNNER_TEMP/grasp-agent-runtime/sandbox-runtime.tgz"
          --sandbox-image grasp-agent-e2e-sandbox:ci
          --output "$RUNNER_TEMP/agent-e2e-artifacts"
      - name: Publish coverage boundary and results
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/agent-e2e-artifacts/report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if not p.exists():
              print('Agent switching E2E did not reach the matrix. Inspect the failed build/install step.')
              raise SystemExit(0)
          r = json.loads(p.read_text())
          print('### Agent switching E2E: ' + r['status'])
          print('\n| Tool | Execution coverage |\n| --- | --- |')
          for tool in r['tools']:
              print('| ' + tool['id'] + ' | ' + tool['mode'] + ' |')
          print('\nCompleted cases: ' + str(len(r['switches'])) + '. Paid model calls: 0.')
          print('\n' + r['nativePlatformInference'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-e2e-results
          path: ${{ runner.temp }}/agent-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
