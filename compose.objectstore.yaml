# Bundled SeaweedFS shared by compose.release.yaml and docker-compose.yml via
# `extends`. Each stack adds its own profile and data directory.
# scripts/local-objectstore.sh reads the default image from this file.
services:
  objectstore:
    image: ${GRASP_LOCAL_OBJECTSTORE_IMAGE:-chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0}
    user: "${GRASP_LOCAL_OBJECTSTORE_UID:-10001}:${GRASP_LOCAL_OBJECTSTORE_GID:-10001}"
    entrypoint: [/usr/bin/weed]
    environment:
      GODEBUG: fips140=on
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -bucket=${GRASP_S3_BUCKET:-grasp}
      - -s3.config=/etc/grasp-storage/iam.json
      - -s3.autoCreateBucket=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
    ports:
      - "127.0.0.1:${GRASP_LOCAL_OBJECTSTORE_PORT:-8333}:8333"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8888/buckets/${GRASP_S3_BUCKET:-grasp}/?limit=1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
